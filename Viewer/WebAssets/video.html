<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Video Viewer</title>
  <link rel="stylesheet" href="video.css" />
</head>
<body>
  <!-- 画像ウィンドウ踏襲：中央にコンテンツ、右側に開閉可能な詳細ペイン（resizer で幅変更） -->
  <div id="stage" class="stage">
    <video id="vid" autoplay></video>
    <div id="errBox" class="err hidden">
      <div>この形式はアプリ内で再生できません</div>
      <button id="openExternal">既定のアプリで開く</button>
    </div>
    <div id="hint" class="hint"></div>

    <!-- 自前の再生コントロール（標準 controls の代替）。シークバー上に A-B の ▼ マーカーを置く。 -->
    <div id="controls" class="controls">
      <div id="seek" class="seek">
        <div class="seek-track">
          <div id="seekBuffered" class="seek-buffered"></div>
          <div id="abRange" class="ab-range hidden"></div>
          <div id="seekPlayed" class="seek-played"></div>
        </div>
        <div id="seekThumb" class="seek-thumb"></div>
        <div id="abMarkA" class="ab-mark hidden" title="A 点（ドラッグで移動）"><span class="ab-flag">A</span></div>
        <div id="abMarkB" class="ab-mark hidden" title="B 点（ドラッグで移動）"><span class="ab-flag">B</span></div>
        <div id="seekTip" class="seek-tip"></div>
        <div id="seekPreview" class="seek-preview">
          <canvas id="seekPreviewCanvas" class="seek-preview-canvas"></canvas>
          <div id="seekPreviewLabel" class="seek-preview-label"></div>
        </div>
      </div>
      <div class="ctl-row">
        <button id="playBtn" class="ctl-btn" tabindex="-1" title="再生 / 一時停止 (Space)">
          <svg viewBox="0 0 24 24"><path id="playIcon" d="M8 5v14l11-7z"/></svg>
        </button>
        <span id="timeLabel" class="time">0:00 / 0:00</span>
        <!-- 前の動画 / 次の動画（ファイル一覧の並び順。連続再生の On/Off に関係なく使える） -->
        <button id="prevBtn" class="ctl-btn" tabindex="-1" title="前の動画 (PageUp)">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6V6zm3.5 6 8.5 6V6l-8.5 6z"/></svg>
        </button>
        <button id="nextBtn" class="ctl-btn" tabindex="-1" title="次の動画 (PageDown)">
          <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6h2v12h-2V6z"/></svg>
        </button>
        <!-- ループ / 連続再生 は独立した On/Off トグル（両方 On = 一覧を最後まで再生したら先頭へ戻る） -->
        <button id="loopBtn" class="ctl-btn toggle" tabindex="-1" title="ループ再生 On/Off (R)：連続再生 On のときは最後の動画の後に最初へ戻る">
          <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
        </button>
        <button id="contBtn" class="ctl-btn toggle" tabindex="-1" title="連続再生 On/Off (N)：再生し終わったら一覧の次の動画へ（最後の動画で停止。ループ On なら先頭へ戻る）">
          <svg viewBox="0 0 24 24"><path d="M3 6h11v2H3V6zm0 4h11v2H3v-2zm0 4h7v2H3v-2zm11 0v6l5-3-5-3zm6-8h2v14h-2V6z"/></svg>
        </button>
        <button id="abBtn" class="ctl-btn text ab" tabindex="-1" title="A-B リピート (A)：クリックでシークバーに ▼ を出し、ドラッグで区間を設定">A-B</button>
        <div class="ctl-spacer"></div>
        <button id="muteBtn" class="ctl-btn" tabindex="-1" title="ミュート (M)">
          <svg viewBox="0 0 24 24"><path id="volIcon" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
        </button>
        <input id="volRange" class="vol" type="range" min="0" max="1" step="0.01" tabindex="-1" title="音量" />
        <div class="rate-wrap">
          <button id="rateBtn" class="ctl-btn rate" tabindex="-1" title="再生速度（クリックで一覧 / + − 0）">1x</button>
          <div id="rateMenu" class="rate-menu hidden"></div>
        </div>
        <button id="fsBtn" class="ctl-btn" tabindex="-1" title="全画面 (F)">
          <svg viewBox="0 0 24 24"><path id="fsIcon" d="M7 14H5v5h5v-2H7zm-2-4h2V7h3V5H5zm12 7h-3v2h5v-5h-2zm-3-12v2h3v3h2V5z"/></svg>
        </button>
      </div>
    </div>
  </div>
  <div id="overlayResizer" class="overlay-resizer hidden"></div>
  <div id="overlay" class="overlay hidden"></div>

  <!-- 左上ボタン群（マウス移動時のみ表示）：詳細ペイン開閉。再生モード / A-B は下部コントローラーへ移動。 -->
  <div id="sideBtns" class="side-btns">
    <button id="detailBtn" class="side-btn" title="詳細ペインの表示/非表示 (D)">&#8505;</button>
  </div>

  <script src="shortcuts-catalog.js"></script>
  <script src="shortcut-dispatch.js"></script>
  <script src="details-render.js"></script>
  <script src="video-glue.js"></script>
</body>
</html>
